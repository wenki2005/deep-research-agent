[project]
name = "deep-research-agent"
version = "1.0.0"
description = "Multi-agent deep research assistant built on the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.19",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "chromadb>=1.5.9",
    "reportlab>=5.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
web = [
    "streamlit>=1.36",
]

[project.scripts]
research = "research_agent.cli:main"
research-api = "research_agent.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
